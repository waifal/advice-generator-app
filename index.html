<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Advice generator app</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <div class="card-wrapper">
            <article class="card__container">
                <div>
                    <h2 class="advice-number">Advice <span id="advice-id">#117</span></h2>
                    <blockquote id="advice-text" class="advice-text">
                        &#8220;It is easy to sit up and take notice, what's difficult is getting up and taking
                        action.&#8221;
                    </blockquote>
                </div>
                <div class="card__divider">
                    <img src="images/pattern-divider-desktop.svg" alt="" draggable="false" aria-hidden="true">
                </div>
                <div>
                    <button id="generate-advice-btn" class="generate-advice-btn" type="button"
                        aria-label="Generate new advice">
                        <img src="images/icon-dice.svg" alt="Dice" draggable="false">
                    </button>
                </div>
            </article>
        </div>
    </main>
    <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        Coded by <a href="https://github.com/waifal">Wai Fal</a>.
    </div>
    <script src="app.js"></script>
</body>

</html>
